name: Проверки основы приложения

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  linux:
    name: Проверки Linux
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - name: Системные библиотеки Qt для offscreen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libegl1 libopengl0
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests tools
      - run: uv run --frozen ruff format --check src tests tools
      - run: uv run --frozen mypy src/personal_finance
      - run: uv run --frozen pytest -q
      - shell: pwsh
        run: ./packaging/windows/test_helpers.ps1 -PythonPath .venv/bin/python
      - run: uv run --frozen python -m personal_finance.bootstrap.main --self-test
  windows:
    name: Проверки и сборка Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - shell: powershell
        run: ./packaging/windows/verify.ps1 -Headless
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-check
          path: |
            artifacts/windows-check-*/report.json
            artifacts/windows-check-*/*.json
            artifacts/windows-check-*/*.log
            artifacts/windows-check-*/tests.xml
            artifacts/windows-check-*/bundle/*.json
            artifacts/windows-check-*/bundle/*.log
          if-no-files-found: warn
          retention-days: 14
