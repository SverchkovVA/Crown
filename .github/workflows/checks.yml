name: Проверки основы приложения

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  linux:
    name: Проверки Linux
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests tools
      - run: uv run --frozen ruff format --check src tests tools
      - run: uv run --frozen mypy src/personal_finance
      - run: uv run --frozen pytest -q
      - shell: pwsh
        run: ./packaging/windows/test_helpers.ps1 -PythonPath .venv/bin/python
      - run: uv run --frozen python -m personal_finance.bootstrap.main --self-test
  windows:
    name: Проверки и сборка Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - shell: powershell
        run: ./packaging/windows/verify.ps1 -Headless
