name: Проверки основы приложения

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Проверки ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.23'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check src tests tools
      - run: uv run --frozen ruff format --check src tests tools
      - run: uv run --frozen mypy src/personal_finance
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m personal_finance.bootstrap.main --self-test
      - if: runner.os == 'Windows'
        run: ./packaging/windows/build.ps1
