name: Проверки Android

on:
  push:
    paths:
      - 'android/**'
      - 'shared/android-fixtures/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/android-fixtures/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Среда Android
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          if [[ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" || ! -d "$ANDROID_HOME/build-tools/35.0.0" ]]; then
            sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
          fi
      - name: Сборка, тесты и lint
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace --info :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-check
          path: |
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore
          retention-days: 14
